<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReeseWave — We've Moved</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0d0d0f;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif;
    color: #f1f0f5;
    overflow: hidden;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  .bg::before, .bg::after {
    content: ''; position: absolute;
    width: 500px; height: 500px; border-radius: 50%;
    filter: blur(160px);
  }
  .bg::before { background: #8b5cf6; opacity: 0.15; top: -100px; left: -100px; }
  .bg::after  { background: #60a5fa; opacity: 0.12; bottom: -150px; right: -120px; }

  .card {
    position: relative; z-index: 1;
    background: #141417;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px; width: 90%;
    text-align: center;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.9) translateY(16px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .logo {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 32px;
  }
  .logo-icon {
    width: 36px; height: 36px; background: #8b5cf6;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
  }
  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800;
  }

  .emoji { font-size: 48px; margin-bottom: 20px; display: block;
    animation: bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px; font-weight: 800;
    margin-bottom: 12px;
  }
  h1 span { color: #a78bfa; }

  .subtitle {
    color: #9491a7; font-size: 15px; line-height: 1.6;
    margin-bottom: 28px;
  }

  .new-url {
    background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 28px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .new-url-label {
    font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: #58566a;
  }
  .new-url-link {
    font-size: 15px; font-weight: 600; color: #a78bfa;
    text-decoration: none; word-break: break-all;
    transition: color 0.15s;
  }
  .new-url-link:hover { color: #fff; }

  .countdown-wrap { margin-bottom: 28px; }
  .countdown-label {
    font-size: 13px; color: #58566a; margin-bottom: 10px;
  }
  .countdown-label span {
    color: #a78bfa; font-weight: 600; font-size: 15px;
  }
  .progress-track {
    height: 4px; background: #1c1c21;
    border-radius: 99px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: #8b5cf6;
    border-radius: 99px; width: 100%;
    transition: width 1s linear;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: #8b5cf6; color: white;
    padding: 14px 32px; border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600;
    text-decoration: none; border: none; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(139,92,246,0.4);
    width: 100%;
  }
  .btn:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 32px rgba(139,92,246,0.5);
  }
  .btn:active { transform: scale(0.98); }

  .footer {
    margin-top: 24px;
    font-size: 12px; color: #58566a;
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
        <path d="M3 12h2l2-6 4 12 4-8 2 6h2" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="logo-text">ReeseWave</span>
  </div>

  <span class="emoji">🎵</span>

  <h1>We've <span>Moved!</span></h1>
  <p class="subtitle">
    ReeseWave has a new home. We've upgraded our platform to give you a faster, better experience. Update your bookmarks!
  </p>

  <div class="new-url">
    <div>
      <div class="new-url-label">Our new address</div>
      <a class="new-url-link" id="new-url-link" href="#">reesewave.pages.dev</a>
    </div>
  </div>

  <div class="countdown-wrap">
    <div class="countdown-label">Redirecting in <span id="countdown">10</span> seconds</div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <a class="btn" id="go-btn" href="#">
    Take me there now →
  </a>

  <div class="footer">© 2026 ReeseWave. All rights reserved.</div>
</div>

<script>
  const NEW_URL = 'https://reesewave.pages.dev'; // 👈 CHANGE THIS to your actual new URL

  document.getElementById('new-url-link').href = NEW_URL;
  document.getElementById('new-url-link').textContent = NEW_URL.replace('https://', '');
  document.getElementById('go-btn').href = NEW_URL;

  let seconds = 10;
  const countdownEl  = document.getElementById('countdown');
  const progressEl   = document.getElementById('progress-bar');

  const timer = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;
    progressEl.style.width  = (seconds / 10 * 100) + '%';
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = NEW_URL;
    }
  }, 1000);
</script>

</body>
</html>
